<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umesh Sharma — Applied AI / ML Engineer</title>
    <meta
      name="description"
      content="Umesh Sharma — AI/ML Intern at PW LeapX and Data Science & AI student at IIT Madras. Building LLM apps, RAG pipelines and AI automations."
    />
    <meta name="author" content="Umesh Sharma" />
    <meta name="theme-color" content="#080810" />

    <!-- Link previews (LinkedIn, WhatsApp, X, Slack…). Set VITE_SITE_URL in .env once deployed. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Umesh Sharma — Applied AI / ML Engineer" />
    <meta
      property="og:description"
      content="LLM-powered apps, RAG pipelines and AI automations — from prototype to production."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Umesh Sharma — Applied AI portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Umesh Sharma — Applied AI / ML Engineer" />
    <meta
      name="twitter:description"
      content="LLM-powered apps, RAG pipelines and AI automations — from prototype to production."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
